name: Validacion basica
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ejecutar pruebas del analizador CSV
        run: python -m unittest discover -s tests -v
      - name: Comprobar archivos mínimos
        run: python scripts/auditar_estructura.py
